name: sta

services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    env_file: .env
    # Migra, crea el root si no existe y arranca con recarga en caliente.
    command: >
      sh -c "uv run alembic upgrade head
      && uv run python -m app.seed
      && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Archivos que suben los usuarios (imagen de perfil), fuera del código montado.
      # Debe coincidir con ARCHIVOS_DIR (app/core/config.py). `down -v` lo borra.
      - archivos:/data/archivos
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 5s
      retries: 40

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # design/ queda en la misma ruta relativa que en el repo (../design desde frontend/).
      - ./frontend:/app/frontend
      - ./design:/app/design
      # node_modules vive en un volumen aparte para no mezclarse con el del anfitrión.
      - frontend-node-modules:/app/frontend/node_modules

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # ---------- Prueba de carga de la búsqueda (issue #135, RNF-01) ----------
  # Los servicios del perfil `carga` no arrancan con `docker compose up`: se piden con
  # `--profile carga`. Procedimiento completo en docs/pruebas/carga-busqueda.md.
  backend-carga:
    profiles: ["carga"]
    build: ./backend
    env_file: .env
    environment:
      # Base aparte que crea y borra scripts/carga/sembrar.py: la de desarrollo no se toca.
      DATABASE_URL: ${CARGA_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/sta_carga}
      # Sin tareas programadas (ni envío de la cola de correos) durante la medición.
      PLANIFICADOR_ACTIVO: "false"
      # Se habla por http dentro de la red de compose: una cookie Secure no viajaría.
      COOKIE_SECURE: "false"
      CARGA_CONTRASENA: ${CARGA_CONTRASENA:-CargaSta2026}
    # Sin --reload y con varios procesos, como en un despliegue. La base la prepara el sembrado.
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${CARGA_WORKERS:-4} --no-access-log
    ports:
      - "${CARGA_BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 5s
      retries: 40

  k6:
    profiles: ["carga"]
    image: grafana/k6:2.4.0
    user: "1000:1000"
    command: ["run", "/carga/busqueda.js"]
    environment:
      BASE_URL: http://backend-carga:8000/api/v1
      CARGA_CONTRASENA: ${CARGA_CONTRASENA:-CargaSta2026}
    volumes:
      - ./carga:/carga:ro
      - ./carga/resultados:/resultados
    depends_on:
      backend-carga:
        condition: service_healthy

volumes:
  db-data:
  archivos:
  frontend-node-modules:
